[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "protocolo-his"
version = "0.2.1"
description = "Plataforma para execução auditável do Protocolo HIS"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "django>=5.2,<6",
  "psycopg[binary]>=3.2,<4",
  "prefect>=3.4,<4",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "httpx>=0.28,<1",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-django>=4.11,<5",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]
qualification = [
  "conversor-his @ git+https://github.com/hilaliskandar/conversor-his.git@de39b9f1f86bd089dad9fcc5d95663a2b0600710",
]
ml = [
  "scikit-learn>=1.7,<2",
  "duckdb>=1.3,<2",
  "pyarrow>=20,<21",
]
reports = [
  "python-docx>=1.2,<2",
  "docxtpl>=0.20,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["config", "applications"]

[tool.hatch.build.targets.sdist]
include = [
  "/config",
  "/applications",
  "/schemas",
  "/docs",
  "/manage.py",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py", "*_test.py", "tests.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint.per-file-ignores]
"applications/models.py" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
