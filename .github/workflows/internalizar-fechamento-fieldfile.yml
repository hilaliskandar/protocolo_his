name: Internalizar fechamento de FieldFile

on:
  push:
    branches:
      - fix/portabilidade-windows-postgresql-0.3.6
    paths:
      - .github/workflows/internalizar-fechamento-fieldfile.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          ref: fix/portabilidade-windows-postgresql-0.3.6

      - name: Internalizar correção no modelo
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          caminho_modelo = Path("applications/models.py")
          texto = caminho_modelo.read_text(encoding="utf-8")
          padrao = re.compile(
              r"    def _calcular_sha256\(self\) -> str:\n.*?(?=\n    def _localizar_duplicado)",
              re.DOTALL,
          )
          substituto = '''    def _calcular_sha256(self) -> str:
              resumo = sha256()
              estava_fechado = self.arquivo.closed
              arquivo = self.arquivo.file

              try:
                  posicao_original = arquivo.tell() if arquivo.seekable() else None
                  arquivo.seek(0)

                  if hasattr(arquivo, "chunks"):
                      for bloco in arquivo.chunks():
                          resumo.update(bloco)
                  else:
                      while bloco := arquivo.read(1024 * 1024):
                          resumo.update(bloco)

                  if posicao_original is not None:
                      arquivo.seek(posicao_original)

                  return resumo.hexdigest()
              finally:
                  if estava_fechado:
                      self.arquivo.close()
          '''
          texto_corrigido, quantidade = padrao.subn(substituto.rstrip(), texto, count=1)
          if quantidade != 1:
              raise SystemExit(f"Método substituído {quantidade} vezes; esperado: 1.")
          caminho_modelo.write_text(texto_corrigido, encoding="utf-8")

          Path("applications/apps.py").write_text(
              'from django.apps import AppConfig\n\n\n'
              'class ApplicationsConfig(AppConfig):\n'
              '    default_auto_field = "django.db.models.BigAutoField"\n'
              '    name = "applications"\n'
              '    verbose_name = "Aplicações do Protocolo HIS"\n',
              encoding="utf-8",
          )
          Path("applications/compatibilidade_arquivos.py").unlink(missing_ok=True)
          Path(".github/workflows/internalizar-fechamento-fieldfile.yml").unlink()
          PY

      - name: Validar alteração antes do commit
        run: |
          grep -A 26 "def _calcular_sha256" applications/models.py
          test ! -e applications/compatibilidade_arquivos.py
          ! grep -q "aplicar_correcao_fieldfile" applications/apps.py

      - name: Registrar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix: fechar FieldFile aberto internamente"
          git push origin HEAD:fix/portabilidade-windows-postgresql-0.3.6
