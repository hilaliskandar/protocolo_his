name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-hotfix-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SECRET_KEY: ci-only-secret-key
  DJANGO_DEBUG: "false"
  PROTOCOL_DATA_ROOT: ${{ github.workspace }}/.ci-data
  POSTGRES_DB: protocolo_his
  POSTGRES_USER: protocolo_his
  POSTGRES_PASSWORD: protocolo_his
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: "5432"

jobs:
  aplicar-correcoes:
    name: Aplicar correções validadas
    if: github.head_ref == 'fix/portabilidade-windows-postgresql-0.3.6'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: protocolo_his
          POSTGRES_USER: protocolo_his
          POSTGRES_PASSWORD: protocolo_his
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U protocolo_his -d protocolo_his"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Obter branch
        uses: actions/checkout@v4
        with:
          ref: fix/portabilidade-windows-postgresql-0.3.6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Aplicar correções
        run: python scripts/aplicar_hotfix_portabilidade.py

      - name: Instalar projeto
        run: python -m pip install -e ".[dev]"

      - name: Executar Ruff
        run: |
          mkdir -p artifacts
          set +e
          python -m ruff check . --output-format=json > artifacts/ruff-hotfix.json
          status=$?
          python -m ruff check . || true
          exit $status

      - name: Publicar diagnóstico Ruff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-hotfix-${{ github.run_id }}
          path: artifacts/ruff-hotfix.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verificar Django
        run: python manage.py check

      - name: Verificar migrações
        run: python manage.py makemigrations --check --dry-run

      - name: Testar portabilidade e interface
        run: python manage.py test applications.test_portabilidade_arquivos applications.test_interface_qualificacao applications.test_pdf_iframe --verbosity 2

      - name: Testar suíte PostgreSQL completa
        run: python manage.py test --verbosity 2

      - name: Registrar correções
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add applications/models.py applications/test_interface_qualificacao.py applications/test_portabilidade_arquivos.py .github/workflows/aplicar-correcoes-portabilidade.yml
          if git diff --cached --quiet; then
            echo "Nenhuma correção pendente."
          else
            git commit -m "fix: concluir portabilidade de arquivos e PostgreSQL"
            git push origin HEAD:fix/portabilidade-windows-postgresql-0.3.6
          fi
