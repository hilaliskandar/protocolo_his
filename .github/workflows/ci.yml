name: CI

on:
  push:
    branches:
      - main
      - "incremento/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SECRET_KEY: ci-only-secret-key
  DJANGO_DEBUG: "false"
  PROTOCOL_DATA_ROOT: ${{ github.workspace }}/.ci-data
  POSTGRES_DB: protocolo_his
  POSTGRES_USER: protocolo_his
  POSTGRES_PASSWORD: protocolo_his
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: "5432"

jobs:
  aplicar-correcoes:
    name: Aplicar correções validadas
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/portabilidade-windows-postgresql-0.3.6'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: protocolo_his
          POSTGRES_USER: protocolo_his
          POSTGRES_PASSWORD: protocolo_his
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U protocolo_his -d protocolo_his"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Obter branch
        uses: actions/checkout@v4
        with:
          ref: fix/portabilidade-windows-postgresql-0.3.6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Aplicar correções
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          caminho_modelo = Path("applications/models.py")
          texto_modelo = caminho_modelo.read_text(encoding="utf-8")
          if 'self.arquivo.open("rb")' not in texto_modelo:
              padrao = re.compile(
                  r"    def _calcular_sha256\(self\) -> str:\n.*?(?=\n    def _localizar_duplicado)",
                  re.DOTALL,
              )
              metodo = '''    def _calcular_sha256(self) -> str:
        resumo = sha256()
        estava_fechado = self.arquivo.closed
        arquivo = None
        posicao_original = None

        try:
            if estava_fechado:
                self.arquivo.open("rb")

            arquivo = self.arquivo.file
            if arquivo.seekable():
                posicao_original = arquivo.tell()
                arquivo.seek(0)

            if hasattr(arquivo, "chunks"):
                for bloco in arquivo.chunks():
                    resumo.update(bloco)
            else:
                while bloco := arquivo.read(1024 * 1024):
                    resumo.update(bloco)

            return resumo.hexdigest()
        finally:
            if estava_fechado:
                self.arquivo.close()
            elif arquivo is not None and posicao_original is not None:
                arquivo.seek(posicao_original)
'''
              texto_modelo, quantidade = padrao.subn(metodo.rstrip(), texto_modelo, count=1)
              if quantidade != 1:
                  raise SystemExit(f"Método substituído {quantidade} vezes; esperado: 1.")
              caminho_modelo.write_text(texto_modelo, encoding="utf-8")

          caminho_interface = Path("applications/test_interface_qualificacao.py")
          texto_interface = caminho_interface.read_text(encoding="utf-8")
          texto_interface = texto_interface.replace("from django.db import connections\n", "")
          texto_interface = re.sub(
              r"class TestesInterfaceQualificacao\(TestCase\):\n"
              r"    @classmethod\n"
              r"    def setUpClass\(cls\):\n"
              r"        connections\.close_all\(\)\n"
              r"        super\(\)\.setUpClass\(\)\n\n",
              "class TestesInterfaceQualificacao(TestCase):\n",
              texto_interface,
              count=1,
          )
          caminho_interface.write_text(texto_interface, encoding="utf-8")

          Path("applications/test_portabilidade_arquivos.py").write_text(
              '''from hashlib import sha256
from pathlib import Path
from tempfile import TemporaryDirectory

from django.core.files.uploadedfile import SimpleUploadedFile
from django.test import TestCase

from applications.models import (
    AplicacaoMunicipal,
    DocumentoNormativo,
    Municipio,
    TipoNormativo,
    VersaoDocumento,
)


class TestesPortabilidadeArquivos(TestCase):
    CONTEUDO = b"%PDF-1.7\\nconteudo"

    def setUp(self):
        municipio = Municipio.objects.create(nome="Recife", uf="PE")
        aplicacao = AplicacaoMunicipal.objects.create(
            municipio=municipio,
            titulo="Aplicação Recife",
        )
        self.documento = DocumentoNormativo.objects.create(
            aplicacao=aplicacao,
            tipo=TipoNormativo.objects.get(codigo="lei_complementar"),
            numero="2",
            ano=2021,
            titulo="Plano Diretor",
        )
        self.resumo_esperado = sha256(self.CONTEUDO).hexdigest()

    def _criar_versao(self):
        criada = VersaoDocumento.objects.create(
            documento=self.documento,
            arquivo=SimpleUploadedFile(
                "hash-pendente.pdf",
                self.CONTEUDO,
                "application/pdf",
            ),
            mime_type="application/pdf",
        )
        return criada, VersaoDocumento.objects.get(pk=criada.pk)

    def test_calculo_sha256_fecha_handle_aberto_internamente(self):
        with TemporaryDirectory() as diretorio, self.settings(MEDIA_ROOT=Path(diretorio)):
            criada, versao = self._criar_versao()
            try:
                self.assertTrue(versao.arquivo.closed)
                resumo = versao._calcular_sha256()
                self.assertEqual(resumo, self.resumo_esperado)
                self.assertEqual(resumo, criada.sha256)
                self.assertTrue(versao.arquivo.closed)
            finally:
                criada.arquivo.close()
                versao.arquivo.close()

    def test_calculo_sha256_pode_ser_executado_duas_vezes(self):
        with TemporaryDirectory() as diretorio, self.settings(MEDIA_ROOT=Path(diretorio)):
            criada, versao = self._criar_versao()
            try:
                primeiro = versao._calcular_sha256()
                segundo = versao._calcular_sha256()
                self.assertEqual(primeiro, self.resumo_esperado)
                self.assertEqual(segundo, self.resumo_esperado)
                self.assertTrue(versao.arquivo.closed)
            finally:
                criada.arquivo.close()
                versao.arquivo.close()

    def test_calculo_sha256_preserva_handle_aberto_e_posicao(self):
        with TemporaryDirectory() as diretorio, self.settings(MEDIA_ROOT=Path(diretorio)):
            criada, versao = self._criar_versao()
            try:
                versao.arquivo.open("rb")
                versao.arquivo.seek(5)
                resumo = versao._calcular_sha256()
                self.assertEqual(resumo, self.resumo_esperado)
                self.assertFalse(versao.arquivo.closed)
                self.assertEqual(versao.arquivo.tell(), 5)
            finally:
                criada.arquivo.close()
                versao.arquivo.close()
''',
              encoding="utf-8",
          )

          Path(".github/workflows/aplicar-correcoes-portabilidade.yml").unlink(missing_ok=True)
          PY

      - name: Instalar projeto
        run: python -m pip install -e ".[dev]"

      - name: Validar correções
        run: |
          python -m ruff check .
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test applications.test_portabilidade_arquivos applications.test_interface_qualificacao applications.test_pdf_iframe --verbosity 2
          python manage.py test --verbosity 2

      - name: Registrar correções
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add applications/models.py applications/test_interface_qualificacao.py applications/test_portabilidade_arquivos.py .github/workflows/aplicar-correcoes-portabilidade.yml
          if git diff --cached --quiet; then
            echo "Nenhuma correção pendente."
          else
            git commit -m "fix: concluir portabilidade de arquivos e PostgreSQL"
            git push origin HEAD:fix/portabilidade-windows-postgresql-0.3.6
          fi

  quality-and-tests:
    name: Qualidade e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: protocolo_his
          POSTGRES_USER: protocolo_his
          POSTGRES_PASSWORD: protocolo_his
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U protocolo_his -d protocolo_his"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Atualizar ferramentas de empacotamento
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Instalar projeto e dependências de desenvolvimento
        run: python -m pip install -e ".[dev,qualificacao,observabilidade-ia]"

      - name: Verificar dependências instaladas
        run: python -m pip check

      - name: Confirmar PostgreSQL canônico
        run: |
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from django.conf import settings
          engine = settings.DATABASES["default"]["ENGINE"]
          if engine != "django.db.backends.postgresql":
              raise SystemExit(f"Backend de banco inesperado: {engine}")
          PY
          if git grep -n -E 'django\.db\.backends\.sqlite3|^[[:space:]]*import sqlite3|config\.settings_test' -- '*.py' '*.toml'; then
            echo "Referência indevida ao SQLite encontrada."
            exit 1
          fi

      - name: Executar Ruff
        run: |
          mkdir -p artifacts
          set +e
          python -m ruff check . --output-format=json > artifacts/ruff.json
          status=$?
          python -m ruff check . || true
          exit $status

      - name: Executar verificações do Django
        run: python manage.py check

      - name: Verificar migrações pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Executar testes
        run: |
          mkdir -p artifacts
          python -m pytest -q --junitxml=artifacts/pytest.xml

      - name: Validar utilitário de contagem de tokens
        run: python scripts/contar_tokens_corpus_his.py --help

      - name: Publicar diagnósticos de qualidade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-results-${{ github.run_id }}
          path: |
            artifacts/ruff.json
            artifacts/pytest.xml
          if-no-files-found: warn
          retention-days: 14

  postgres-migrations:
    name: PostgreSQL, migrações e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: protocolo_his
          POSTGRES_USER: protocolo_his
          POSTGRES_PASSWORD: protocolo_his
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U protocolo_his -d protocolo_his"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Atualizar ferramentas de empacotamento
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Instalar projeto
        run: python -m pip install -e ".[dev]"

      - name: Verificar configuração com PostgreSQL
        run: python manage.py check

      - name: Aplicar migrações em banco vazio
        run: python manage.py migrate --noinput

      - name: Confirmar ausência de migrações não versionadas
        run: python manage.py makemigrations --check --dry-run

      - name: Executar testes com PostgreSQL
        run: |
          mkdir -p artifacts
          set -o pipefail
          python manage.py test --verbosity 2 2>&1 | tee artifacts/postgresql-tests.log

      - name: Publicar diagnóstico PostgreSQL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-results-${{ github.run_id }}
          path: artifacts/postgresql-tests.log
          if-no-files-found: warn
          retention-days: 14
