name: CI

on:
  push:
    branches:
      - main
      - "incremento/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SECRET_KEY: ci-only-secret-key
  DJANGO_DEBUG: "false"
  PROTOCOL_DATA_ROOT: ${{ github.workspace }}/.ci-data
  POSTGRES_DB: protocolo_his
  POSTGRES_USER: protocolo_his
  POSTGRES_PASSWORD: protocolo_his
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: "5432"

jobs:
  quality-and-tests:
    name: Qualidade e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: protocolo_his
          POSTGRES_USER: protocolo_his
          POSTGRES_PASSWORD: protocolo_his
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U protocolo_his -d protocolo_his"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Atualizar ferramentas de empacotamento
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Instalar projeto e dependências de desenvolvimento
        run: python -m pip install -e ".[dev,qualificacao,observabilidade-ia]"

      - name: Verificar dependências instaladas
        run: python -m pip check

      - name: Confirmar PostgreSQL canônico
        run: |
          python -c "import os; os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings'); import django; django.setup(); from django.conf import settings; engine=settings.DATABASES['default']['ENGINE']; assert engine == 'django.db.backends.postgresql', engine"
          if git grep -n -E 'django\.db\.backends\.sqlite3|^[[:space:]]*import sqlite3|config\.settings_test' -- '*.py' '*.toml'; then
            echo "Referência indevida ao SQLite encontrada."
            exit 1
          fi

      - name: Executar Ruff
        run: |
          mkdir -p artifacts
          set +e
          python -m ruff check . --output-format=json > artifacts/ruff.json
          status=$?
          python -m ruff check . || true
          exit $status

      - name: Executar verificações do Django
        run: python manage.py check

      - name: Verificar migrações pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Executar testes
        run: |
          mkdir -p artifacts
          python -m pytest -q --junitxml=artifacts/pytest.xml

      - name: Validar utilitário de contagem de tokens
        run: python scripts/contar_tokens_corpus_his.py --help

      - name: Publicar diagnósticos de qualidade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-results-${{ github.run_id }}
          path: |
            artifacts/ruff.json
            artifacts/pytest.xml
          if-no-files-found: warn
          retention-days: 14

  postgres-migrations:
    name: PostgreSQL, migrações e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: protocolo_his
          POSTGRES_USER: protocolo_his
          POSTGRES_PASSWORD: protocolo_his
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U protocolo_his -d protocolo_his"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Atualizar ferramentas de empacotamento
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Instalar projeto
        run: python -m pip install -e ".[dev]"

      - name: Verificar configuração com PostgreSQL
        run: python manage.py check

      - name: Aplicar migrações em banco vazio
        run: python manage.py migrate --noinput

      - name: Confirmar ausência de migrações não versionadas
        run: python manage.py makemigrations --check --dry-run

      - name: Executar testes com PostgreSQL
        run: |
          mkdir -p artifacts
          set -o pipefail
          python manage.py test --verbosity 2 2>&1 | tee artifacts/postgresql-tests.log

      - name: Publicar diagnóstico PostgreSQL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-results-${{ github.run_id }}
          path: artifacts/postgresql-tests.log
          if-no-files-found: warn
          retention-days: 14
