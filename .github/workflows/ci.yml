name: CI

on:
  push:
    branches:
      - main
      - "incremento/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SECRET_KEY: ci-only-secret-key
  DJANGO_DEBUG: "false"
  PROTOCOL_DATA_ROOT: ${{ github.workspace }}/.ci-data

jobs:
  # BEGIN TEMPORARY FIELD FILE FIX
  internalizar-fechamento-fieldfile:
    name: Internalizar fechamento de arquivos
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/portabilidade-windows-postgresql-0.3.6'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Obter branch do hotfix
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Corrigir modelo e remover substituição dinâmica
        run: |
          python - <<'PY'
          from pathlib import Path

          caminho_modelo = Path("applications/models.py")
          texto_modelo = caminho_modelo.read_text(encoding="utf-8")
          bloco_anterior = '''    def _calcular_sha256(self) -> str:
              resumo = sha256()
              arquivo = self.arquivo.file
              posicao_original = arquivo.tell() if arquivo.seekable() else None
              arquivo.seek(0)

              if hasattr(arquivo, "chunks"):
                  for bloco in arquivo.chunks():
                      resumo.update(bloco)
              else:
                  while bloco := arquivo.read(1024 * 1024):
                      resumo.update(bloco)

              if posicao_original is not None:
                  arquivo.seek(posicao_original)
              return resumo.hexdigest()
          '''
          bloco_novo = '''    def _calcular_sha256(self) -> str:
              resumo = sha256()
              estava_fechado = self.arquivo.closed
              arquivo = self.arquivo.file

              try:
                  posicao_original = arquivo.tell() if arquivo.seekable() else None
                  arquivo.seek(0)

                  if hasattr(arquivo, "chunks"):
                      for bloco in arquivo.chunks():
                          resumo.update(bloco)
                  else:
                      while bloco := arquivo.read(1024 * 1024):
                          resumo.update(bloco)

                  if posicao_original is not None:
                      arquivo.seek(posicao_original)

                  return resumo.hexdigest()
              finally:
                  if estava_fechado:
                      self.arquivo.close()
          '''
          if texto_modelo.count(bloco_anterior) != 1:
              raise SystemExit("O método original não foi localizado exatamente uma vez.")
          caminho_modelo.write_text(
              texto_modelo.replace(bloco_anterior, bloco_novo, 1),
              encoding="utf-8",
          )

          Path("applications/apps.py").write_text(
              'from django.apps import AppConfig\n\n\n'
              'class ApplicationsConfig(AppConfig):\n'
              '    default_auto_field = "django.db.models.BigAutoField"\n'
              '    name = "applications"\n'
              '    verbose_name = "Aplicações do Protocolo HIS"\n',
              encoding="utf-8",
          )
          Path("applications/compatibilidade_arquivos.py").unlink(missing_ok=True)
          Path(".github/workflows/internalizar-fechamento-fieldfile.yml").unlink(missing_ok=True)

          caminho_ci = Path(".github/workflows/ci.yml")
          texto_ci = caminho_ci.read_text(encoding="utf-8")
          marcador_inicio = "  # BEGIN TEMPORARY FIELD FILE FIX\n"
          marcador_fim = "  # END TEMPORARY FIELD FILE FIX\n"
          inicio = texto_ci.index(marcador_inicio)
          fim = texto_ci.index(marcador_fim, inicio) + len(marcador_fim)
          caminho_ci.write_text(texto_ci[:inicio] + texto_ci[fim:], encoding="utf-8")
          PY

      - name: Registrar correção na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix: fechar FieldFile aberto internamente"
          git push origin HEAD:${{ github.head_ref }}
  # END TEMPORARY FIELD FILE FIX

  quality-and-tests:
    name: Qualidade e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Atualizar ferramentas de empacotamento
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Instalar projeto e dependências de desenvolvimento
        run: python -m pip install -e ".[dev,qualificacao,observabilidade-ia]"

      - name: Verificar dependências instaladas
        run: python -m pip check

      - name: Executar Ruff
        run: |
          mkdir -p artifacts
          set +e
          python -m ruff check . --output-format=json > artifacts/ruff.json
          status=$?
          python -m ruff check . || true
          exit $status

      - name: Executar verificações do Django
        run: python manage.py check --settings=config.settings_test

      - name: Verificar migrações pendentes
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test

      - name: Executar testes
        run: |
          mkdir -p artifacts
          python -m pytest -q --junitxml=artifacts/pytest.xml

      - name: Validar utilitário de contagem de tokens
        run: python scripts/contar_tokens_corpus_his.py --help

      - name: Publicar diagnósticos de qualidade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-results-${{ github.run_id }}
          path: |
            artifacts/ruff.json
            artifacts/pytest.xml
          if-no-files-found: warn
          retention-days: 14

  postgres-migrations:
    name: PostgreSQL, migrações e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: protocolo_his
          POSTGRES_USER: protocolo_his
          POSTGRES_PASSWORD: protocolo_his
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U protocolo_his -d protocolo_his"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: protocolo_his
      POSTGRES_USER: protocolo_his
      POSTGRES_PASSWORD: protocolo_his
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Atualizar ferramentas de empacotamento
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Instalar projeto
        run: python -m pip install -e ".[dev]"

      - name: Verificar configuração com PostgreSQL
        run: python manage.py check

      - name: Aplicar migrações em banco vazio
        run: python manage.py migrate --noinput

      - name: Confirmar ausência de migrações não versionadas
        run: python manage.py makemigrations --check --dry-run

      - name: Executar testes com PostgreSQL
        run: python manage.py test --verbosity 2
