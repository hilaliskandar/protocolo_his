name: Aplicar correções finais de portabilidade

on:
  push:
    branches:
      - fix/portabilidade-windows-postgresql-0.3.6
    paths:
      - .github/workflows/aplicar-correcoes-portabilidade.yml

permissions:
  contents: write

jobs:
  corrigir-testar-e-registrar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: protocolo_his
          POSTGRES_USER: protocolo_his
          POSTGRES_PASSWORD: protocolo_his
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U protocolo_his -d protocolo_his"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHON_VERSION: "3.12"
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "false"
      PROTOCOL_DATA_ROOT: ${{ github.workspace }}/.ci-data
      POSTGRES_DB: protocolo_his
      POSTGRES_USER: protocolo_his
      POSTGRES_PASSWORD: protocolo_his
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Obter branch
        uses: actions/checkout@v4
        with:
          ref: fix/portabilidade-windows-postgresql-0.3.6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Aplicar correções
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          caminho_modelo = Path("applications/models.py")
          texto_modelo = caminho_modelo.read_text(encoding="utf-8")
          padrao_metodo = re.compile(
              r"    def _calcular_sha256\(self\) -> str:\n.*?(?=\n    def _localizar_duplicado)",
              re.DOTALL,
          )
          novo_metodo = '''    def _calcular_sha256(self) -> str:
        resumo = sha256()
        estava_fechado = self.arquivo.closed
        arquivo = None
        posicao_original = None

        try:
            if estava_fechado:
                self.arquivo.open("rb")

            arquivo = self.arquivo.file
            if arquivo.seekable():
                posicao_original = arquivo.tell()
                arquivo.seek(0)

            if hasattr(arquivo, "chunks"):
                for bloco in arquivo.chunks():
                    resumo.update(bloco)
            else:
                while bloco := arquivo.read(1024 * 1024):
                    resumo.update(bloco)

            return resumo.hexdigest()
        finally:
            if estava_fechado:
                self.arquivo.close()
            elif arquivo is not None and posicao_original is not None:
                arquivo.seek(posicao_original)
'''
          texto_modelo, quantidade = padrao_metodo.subn(novo_metodo.rstrip(), texto_modelo, count=1)
          if quantidade != 1:
              raise SystemExit(f"Método _calcular_sha256 substituído {quantidade} vezes; esperado: 1.")
          caminho_modelo.write_text(texto_modelo, encoding="utf-8")

          caminho_interface = Path("applications/test_interface_qualificacao.py")
          texto_interface = caminho_interface.read_text(encoding="utf-8")
          texto_interface = texto_interface.replace("from django.db import connections\n", "")
          texto_interface, quantidade = re.subn(
              r"class TestesInterfaceQualificacao\(TestCase\):\n"
              r"    @classmethod\n"
              r"    def setUpClass\(cls\):\n"
              r"        connections\.close_all\(\)\n"
              r"        super\(\)\.setUpClass\(\)\n\n",
              "class TestesInterfaceQualificacao(TestCase):\n",
              texto_interface,
              count=1,
          )
          if quantidade != 1:
              raise SystemExit(f"setUpClass removido {quantidade} vezes; esperado: 1.")
          caminho_interface.write_text(texto_interface, encoding="utf-8")

          Path("applications/test_portabilidade_arquivos.py").write_text(
              '''from hashlib import sha256
from pathlib import Path
from tempfile import TemporaryDirectory

from django.core.files.uploadedfile import SimpleUploadedFile
from django.test import TestCase

from applications.models import (
    AplicacaoMunicipal,
    DocumentoNormativo,
    Municipio,
    TipoNormativo,
    VersaoDocumento,
)


class TestesPortabilidadeArquivos(TestCase):
    CONTEUDO = b"%PDF-1.7\\nconteudo"

    def setUp(self):
        municipio = Municipio.objects.create(nome="Recife", uf="PE")
        aplicacao = AplicacaoMunicipal.objects.create(
            municipio=municipio,
            titulo="Aplicação Recife",
        )
        self.documento = DocumentoNormativo.objects.create(
            aplicacao=aplicacao,
            tipo=TipoNormativo.objects.get(codigo="lei_complementar"),
            numero="2",
            ano=2021,
            titulo="Plano Diretor",
        )
        self.resumo_esperado = sha256(self.CONTEUDO).hexdigest()

    def _criar_versao(self):
        criada = VersaoDocumento.objects.create(
            documento=self.documento,
            arquivo=SimpleUploadedFile(
                "hash-pendente.pdf",
                self.CONTEUDO,
                "application/pdf",
            ),
            mime_type="application/pdf",
        )
        return criada, VersaoDocumento.objects.get(pk=criada.pk)

    def test_calculo_sha256_fecha_handle_aberto_internamente(self):
        with TemporaryDirectory() as diretorio, self.settings(MEDIA_ROOT=Path(diretorio)):
            criada, versao = self._criar_versao()
            try:
                self.assertTrue(versao.arquivo.closed)

                resumo = versao._calcular_sha256()

                self.assertEqual(resumo, self.resumo_esperado)
                self.assertEqual(resumo, criada.sha256)
                self.assertTrue(versao.arquivo.closed)
            finally:
                criada.arquivo.close()
                versao.arquivo.close()

    def test_calculo_sha256_pode_ser_executado_duas_vezes(self):
        with TemporaryDirectory() as diretorio, self.settings(MEDIA_ROOT=Path(diretorio)):
            criada, versao = self._criar_versao()
            try:
                primeiro = versao._calcular_sha256()
                segundo = versao._calcular_sha256()

                self.assertEqual(primeiro, self.resumo_esperado)
                self.assertEqual(segundo, self.resumo_esperado)
                self.assertTrue(versao.arquivo.closed)
            finally:
                criada.arquivo.close()
                versao.arquivo.close()

    def test_calculo_sha256_preserva_handle_aberto_e_posicao(self):
        with TemporaryDirectory() as diretorio, self.settings(MEDIA_ROOT=Path(diretorio)):
            criada, versao = self._criar_versao()
            try:
                versao.arquivo.open("rb")
                versao.arquivo.seek(5)

                resumo = versao._calcular_sha256()

                self.assertEqual(resumo, self.resumo_esperado)
                self.assertFalse(versao.arquivo.closed)
                self.assertEqual(versao.arquivo.tell(), 5)
            finally:
                criada.arquivo.close()
                versao.arquivo.close()
''',
              encoding="utf-8",
          )

          caminho_ci = Path(".github/workflows/ci.yml")
          texto_ci = caminho_ci.read_text(encoding="utf-8")
          padrao_barreira = re.compile(
              r"      - name: Impedir backend SQLite\n"
              r"        run: \|\n"
              r"(?:          .*\n)+?"
              r"(?=\n      - name: Executar Ruff)",
          )
          nova_barreira = '''      - name: Confirmar PostgreSQL canônico
        run: |
          python - <<'PY'
          import os

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")

          import django

          django.setup()

          from django.conf import settings

          engine = settings.DATABASES["default"]["ENGINE"]
          if engine != "django.db.backends.postgresql":
              raise SystemExit(f"Backend de banco inesperado: {engine}")
          PY
          if git grep -n -E 'django\\.db\\.backends\\.sqlite3|^[[:space:]]*import sqlite3|config\\.settings_test' -- '*.py' '*.toml'; then
            echo "Referência indevida ao SQLite encontrada."
            exit 1
          fi
'''
          texto_ci, quantidade = padrao_barreira.subn(nova_barreira.rstrip(), texto_ci, count=1)
          if quantidade != 1:
              raise SystemExit(f"Barreira anti-SQLite substituída {quantidade} vezes; esperado: 1.")
          caminho_ci.write_text(texto_ci, encoding="utf-8")
          PY

      - name: Instalar projeto
        run: python -m pip install -e ".[dev]"

      - name: Validar qualidade e configuração
        run: |
          python -m ruff check .
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Executar testes direcionados
        run: |
          python manage.py test \
            applications.test_portabilidade_arquivos \
            applications.test_interface_qualificacao \
            applications.test_pdf_iframe \
            --verbosity 2

      - name: Executar suíte PostgreSQL completa
        run: python manage.py test --verbosity 2

      - name: Registrar correções validadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add applications/models.py \
            applications/test_interface_qualificacao.py \
            applications/test_portabilidade_arquivos.py \
            .github/workflows/ci.yml
          git commit -m "fix: concluir portabilidade de arquivos e PostgreSQL"
          git push origin HEAD:fix/portabilidade-windows-postgresql-0.3.6
